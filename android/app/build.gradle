plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zexiaotong.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.zexiaotong.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 纯 WebView 套壳，仅用 Android 框架组件，无需额外依赖
}
