<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>择校通</title>
  <meta name="theme-color" content="#c2410c" />
  <link
    rel="icon"
    href='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23c2410c%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2246%22%20font-size%3D%2240%22%20text-anchor%3D%22middle%22%20fill%3D%22%23ffffff%22%20font-family%3D%22serif%22%20font-weight%3D%22700%22%3E%E6%8B%A9%3C%2Ftext%3E%3C%2Fsvg%3E'
  />
  <script>
    // GitHub Pages SPA fallback：
    // 任意未匹配路径会触发 404.html，本脚本把原路径存到 sessionStorage，
    // 再重定向到 /zexiaotong/，让 index.html 的 SPA 接管（main.tsx 会读 sessionStorage 恢复路由）
    (function () {
      try {
        var path = window.location.pathname + window.location.search + window.location.hash;
        var base = '/zexiaotong';
        var rel = path.indexOf(base) === 0 ? path.substring(base.length) : path;
        if (!rel || rel === '/' || rel === '') rel = '/';
        if (rel !== '/') {
          sessionStorage.setItem('zxt.spa.redirect', rel);
        }
        window.location.replace(base + '/');
      } catch (e) {
        window.location.replace('/zexiaotong/');
      }
    })();
  </script>
</head>
<body>
  <noscript>请启用 JavaScript 以使用择校通。</noscript>
</body>
</html>
