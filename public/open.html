<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>择校通 · 在浏览器中打开</title>
<style>
  :root{
    --ink:#1c1814;
    --terra:#c2410c;
    --line:#e8e8e8;
    --bg:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== 微信引导遮罩 ===== */
  #wx-guide{
    position:fixed;inset:0;z-index:9999;display:none;
    background:rgba(20,18,16,.92);color:#fff;
  }
  #wx-guide.show{display:block;}
  .wx-top{position:relative;height:64px;}
  .wx-dots{
    position:absolute;top:18px;right:18px;display:flex;gap:6px;align-items:center;
  }
  .wx-dots span{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.95;}
  .wx-arrow{
    position:absolute;top:34px;right:30px;width:46px;height:46px;
    animation:bounce 1.1s ease-in-out infinite;
  }
  @keyframes bounce{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-8px)}}
  .wx-body{padding:18px 26px;}
  .wx-body h2{font-size:20px;font-weight:700;margin-bottom:14px;letter-spacing:.5px;}
  .wx-step{display:flex;gap:12px;align-items:flex-start;margin:14px 0;}
  .wx-step .num{
    flex:0 0 26px;width:26px;height:26px;border-radius:50%;
    background:var(--terra);color:#fff;font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .wx-step p{font-size:16px;color:#f3efe9;}
  .wx-step p b{color:#fff;}
  .wx-foot{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:13px;color:#b9b2a8;}

  /* ===== 非微信：跳转落地页 ===== */
  #landing{
    min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 24px;text-align:center;
  }
  .brand{font-size:13px;letter-spacing:3px;color:var(--terra);font-weight:700;margin-bottom:18px;}
  .logo{
    width:84px;height:84px;border-radius:20px;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;margin-bottom:22px;
  }
  .landing h1{font-size:22px;font-weight:700;margin-bottom:10px;}
  .landing p{font-size:15px;color:#6b635a;margin-bottom:28px;max-width:280px;}
  .btn{
    display:inline-block;background:var(--terra);color:#fff;text-decoration:none;
    font-size:16px;font-weight:600;padding:14px 40px;border-radius:10px;
    box-shadow:0 2px 0 rgba(0,0,0,.06);
  }
  .tip{margin-top:18px;font-size:12px;color:#a39a8f;}
</style>
</head>
<body>

  <!-- 微信内：引导在浏览器打开 -->
  <div id="wx-guide">
    <div class="wx-top">
      <div class="wx-dots"><span></span><span></span><span></span></div>
      <svg class="wx-arrow" viewBox="0 0 24 24" fill="none" stroke="#ffd9c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 5L5 19"/><path d="M8 5h11v11"/>
      </svg>
    </div>
    <div class="wx-body">
      <h2>请选择「在浏览器打开」</h2>
      <div class="wx-step">
        <div class="num">1</div>
        <p>点击右上角的 <b>···</b> 菜单按钮</p>
      </div>
      <div class="wx-step">
        <div class="num">2</div>
        <p>在弹出菜单中选择 <b>「在浏览器打开」</b></p>
      </div>
      <div class="wx-step">
        <div class="num">3</div>
        <p>即可在浏览器中正常使用 <b>择校通</b></p>
      </div>
    </div>
    <div class="wx-foot">微信内置浏览器不支持直接打开，请按上方步骤操作</div>
  </div>

  <!-- 非微信：直接跳转 -->
  <div id="landing" class="landing">
    <div class="brand">ZEXIAOTONG</div>
    <div class="logo">择</div>
    <h1>正在跳转到择校通</h1>
    <p>志愿填报 / 院校对比 / 城市与公司查询，一站搞定。</p>
    <a class="btn" id="enterBtn" href="https://lwl555.github.io/zexiaotong/">进入择校通</a>
    <div class="tip">若未自动跳转，请点击上方按钮</div>
  </div>

<script>
  (function(){
    var isWeChat = /micromessenger/i.test(navigator.userAgent);
    var TARGET = 'https://lwl555.github.io/zexiaotong/';
    if(isWeChat){
      document.getElementById('wx-guide').classList.add('show');
      document.getElementById('landing').style.display = 'none';
    }else{
      // 非微信：短暂展示后自动跳转（保留落地页作为兜底）
      setTimeout(function(){
        try{ window.location.replace(TARGET); }catch(e){}
      }, 1200);
    }
  })();
</script>
</body>
</html>
